substitutions:
  device_name: ultra-dongle
  device_description: "Ultra X2 dongle with all in one"
  friendly_name: Ultra X2 All in One 
  prj_version: "2026.7.1"

esphome:
  name: ${device_name}
  comment: "${device_description}" 
  name_add_mac_suffix: false
  project: 
    name: "Smartstuff.Ultra"
    version: ${prj_version}
  platformio_options:
    upload_speed: 1500000
  on_boot:
    - priority: -100
      then:
        - pulse_meter.set_total_pulses:
            id: watermeter_pulse
            value: !lambda 'return id(saved_water_pulses);'
        - globals.set:
            id: water_counter_ready
            value: 'true'
    
esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1  
  framework:
    type: arduino
#     type: esp-idf
    
ethernet:
  id: ethernet_connection
  type: W5500
  cs_pin: 13
  clk_pin: 14
  mosi_pin: 16
  miso_pin: 15
  interrupt_pin: 18
  reset_pin: 17
  
  on_connect:
    then:
      - script.execute: show_ethernet_status

  on_disconnect:
    then:
      - script.execute: show_ethernet_status
  
ota:
  platform: esphome
  
web_server:
  
# improv_serial:
#   next_url: http://{{ip_address}}

api:
  reboot_timeout: 0s
  actions:
    - action: p1_dongle_reboot
      then:
        - button.press:
            id: reboot                        
    - action: set_water_total
      variables:
        new_total: int
      then:
        - pulse_meter.set_total_pulses:
            id: watermeter_pulse
            value: !lambda 'return new_total;'                
 
dashboard_import:
  package_import_url: github://mhendriks/esphome-p1/ultra-x2.yaml@main
  
# Enable logging
logger:
  level: WARN

debug:
  update_interval: 60s

script:
  - id: show_ethernet_status
    mode: restart
    then:
      - if:
          condition:
            ethernet.connected:
              id: ethernet_connection
          then:
            - light.turn_on:
                id: esp32_rgb_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 40%
                transition_length: 0ms
          else:
            - light.turn_on:
                id: esp32_rgb_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 40%
                transition_length: 0ms

  - id: flash_dsmr_telegram
    mode: restart
    then:
      - light.turn_on:
          id: esp32_rgb_led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 60%
          transition_length: 0ms
      - delay: 75ms
      - script.execute: show_ethernet_status
                
uart:
  - id: p1_uart
    rx_pin:
      number: 12
      inverted: true
    baud_rate: 115200 #dsmr4/5
    rx_buffer_size: 2400
#---- below dsmr2
#     baud_rate: 9600
#     data_bits: 7
#     parity: EVEN
#     stop_bits: 1
#---- end dsmr2

  - id: p1_bridge_uart
    tx_pin:
      number: 21
    baud_rate: 115200

dsmr:
 uart_id: p1_uart
 id: dsmr_instance
 receive_timeout: 200ms
 max_telegram_length: 2400
 water_mbus_id: 2
#  crc_check: false #dsmr2


globals:
  - id: saved_water_pulses
    type: uint32_t
    restore_value: yes
    initial_value: '0'  # eenmalig instellen via de Home Assistant-action set_water_total
  - id: water_counter_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: pulse_rate
    type: int
    restore_value: no  # aanpassen naar no indien de nieuwe waarde onder de oude ligt
    initial_value: '1000'   # pulse rate van de kWh meter -> xxx pulses / kWh

   
light:
  - platform: esp32_rmt_led_strip
    id: esp32_rgb_led
    name: "_Status LED"
    pin: 9
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    gamma_correct: false

button:  
  - platform: restart
    name: "_Restart device"
    id: reboot
  - platform: factory_reset
    name: "_Restart with Factory Default Settings"
  - platform: template
    name: "_Reset - S0 Total Energy"
    id: button_reset_total
    on_press:
      - pulse_meter.set_total_pulses:
          id: pulse
          value: 0  
                
binary_sensor:
  - platform: gpio
    pin:
      number: 0
      ignore_strapping_warning: true
      inverted: true
      mode:
        input: true
        pullup: true
    name: _PushButton

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Amsterdam"  
         
sensor: 
  - platform: pulse_meter
    name: "Water flow"
    pin: 
      number: 38 #left connector
      mode:
        input: true
        pullup: true 
    id: watermeter_pulse
    state_class: measurement
    unit_of_measurement: 'L/min'
    device_class: volume_flow_rate
    internal_filter: 250ms
    internal_filter_mode: EDGE
    icon: mdi:water-pump
    accuracy_decimals: 1
    total:
      id: water_total
      name: "Water Total"
      device_class: water
      state_class: total_increasing
      icon: mdi:water
      unit_of_measurement: L
      accuracy_decimals: 0
      on_value:
        then:
          - if:
              condition:
                lambda: return id(water_counter_ready);
              then:
                - globals.set:
                    id: saved_water_pulses
                    value: !lambda 'return static_cast<uint32_t>(x);'
      
  - platform: pulse_meter
    id: pulse
    name: Current Power
    pin: 
      number: 45
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true #v3.5 aanzetten
    state_class: measurement
    unit_of_measurement: 'W'
    device_class: power
    internal_filter: 100ms
    internal_filter_mode: EDGE    
    icon: mdi:flash-outline
    filters:
      #- multiply: 0.06 # (60s/1000 pulses per kWh)
      - lambda: return x * ((60.0 / id(pulse_rate)) * 1000.0);
    total:
      name: "S0 Total Energy"
      id: pulse_tot
      unit_of_measurement: "kWh"
      icon: mdi:circle-slice-3
      state_class: total_increasing
      device_class: energy
      accuracy_decimals: 3
      filters:
        - lambda: return x * (1.0 / id(pulse_rate));
        
  - platform: total_daily_energy
    name: 'S0 Daily Energy'
    id:   s0_daily
    power_id: pulse
    unit_of_measurement: 'kWh'
    icon: mdi:circle-slice-3
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001             
    
  - platform: dsmr
#    energy_delivered_lux:
#      name: "Energy Consumed Luxembourg"
#      state_class: total_increasing
    energy_delivered_tariff1:
      name: "Energy Consumed Tariff 1"
      state_class: total_increasing
    energy_delivered_tariff2:
      name: "Energy Consumed Tariff 2"
      state_class: total_increasing
#    energy_returned_lux:
#      name: "Energy Produced Luxembourg"
#      state_class: total_increasing
    energy_returned_tariff1:
      name: "Energy Produced Tariff 1"
      state_class: total_increasing
    energy_returned_tariff2:
      name: "Energy Produced Tariff 2"
      state_class: total_increasing
    power_delivered:
      name: "Power Consumed"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned:
      name: "Power Produced"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    electricity_failures:
      name: "Electricity Failures"
      icon: mdi:alert
    electricity_long_failures:
      name: "Long Electricity Failures"
      icon: mdi:alert
    voltage_l1:
      name: "Voltage Phase 1"
    voltage_l2:
      name: "Voltage Phase 2"
    voltage_l3:
      name: "Voltage Phase 3"
    current_l1:
      name: "Current Phase 1"
    current_l2:
      name: "Current Phase 2"
    current_l3:
      name: "Current Phase 3"
    power_delivered_l1:
      name: "Power Consumed Phase 1"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_delivered_l2:
      name: "Power Consumed Phase 2"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_delivered_l3:
      name: "Power Consumed Phase 3"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned_l1:
      name: "Power Produced Phase 1"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned_l2:
      name: "Power Produced Phase 2"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    power_returned_l3:
      name: "Power Produced Phase 3"
      unit_of_measurement: "W"
      state_class: "measurement"
      accuracy_decimals: 0
      filters:
        - multiply: 1000
    gas_delivered:
      name: "Gas Consumed"
      state_class: total_increasing
    water_delivered:
      name: Water delivered
      state_class: total_increasing
    gas_delivered_be:
      name: "Gas Consumed Belgium"
      state_class: total_increasing
    active_energy_import_current_average_demand:
      name: "Current Average Demand"
    active_energy_import_maximum_demand_running_month:
      name: "Maximum Month Demand"
    active_energy_import_maximum_demand_last_13_months:
      name: "13 Month Maximum Quarterly Demand"    
  - platform: uptime
    name: "_Uptime"

text_sensor:
  - platform: debug
    reset_reason:
      name: "_Reset Reason"
      entity_category: diagnostic
  - platform: dsmr
    telegram:
      name: "telegram"
      disabled_by_default: true
      on_value:
        then:
          - lambda: |-
              p1_bridge_uart->write_str(x.c_str());
          - script.execute: flash_dsmr_telegram
  - platform: dsmr
    electricity_tariff:
      name: "DSMR tariff"
    identification:
      name: "DSMR Identification"
    p1_version:
      name: "DSMR Version"
    p1_version_be:
      name: "DSMR Version Belgium"
  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true
