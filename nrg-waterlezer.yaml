substitutions:
  device_name: nrg-waterlezer
  device_description: "NRG Dongle Pro+ Waterlezer"
  friendly_name: NRG Dongle Pro Waterlezer
  prj_version: "2026.11.02"

esphome:
  name: ${device_name}
  comment: "${device_description}" 
  name_add_mac_suffix: false
  project: 
    name: "smartstuff.nrg_dongle_pro_h2o"
    version: ${prj_version}
  platformio_options:
    upload_speed: 1500000
  on_boot:
    # Restore after globals and pulse_meter setup, before networking starts.
    - priority: 500
      then:
        - pulse_meter.set_total_pulses:
            id: watermeter_pulse
            value: !lambda 'return id(totalWaterUsage);'
        - globals.set:
            id: water_total_ready
            value: 'true'
    
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf  
    
improv_serial:
  next_url: http://{{ip_address}}

api:
  services:
    - service: p1_dongle_reboot
      then:
        - button.press:
            id: reboot                        
    - service: set_water_reading
      # Absolute meter reading in whole liters: 123.456 m3 = 123456 liters.
      variables:
        meter_value: int
      then:
        - if:
            condition:
              lambda: 'return meter_value >= 0;'
            then:
              - pulse_meter.set_total_pulses:
                  id: watermeter_pulse
                  value: !lambda 'return meter_value;'

globals:
  - id: totalWaterUsage
    type: int
    restore_value: true
    initial_value: '0'       # Absolute reading in liters; set via set_water_reading.
  - id: water_total_ready
    type: bool
    restore_value: false
    initial_value: 'false'

ota:
  platform: esphome
  
captive_portal:
web_server:
wifi:
# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    ap_timeout: 15s

dashboard_import:
  package_import_url: github://mhendriks/esphome-p1/nrg-waterlezer.yaml@main

# Enable logging
logger:
  level: ERROR
  
status_led:
  pin:
    number: 3
    inverted: true
    id: led 

button:  
  - platform: restart
    name: "_Restart device"
    id: reboot
  - platform: factory_reset
    name: "_Restart with Factory Default Settings"
  - platform: template
    name: "_Reset - Total Water Counter"
    id: button_reset_total
    on_press:
      - pulse_meter.set_total_pulses:
          id: watermeter_pulse
          value: '0'
      
binary_sensor:
  - platform: gpio
    pin:
      number: 9
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
        
    name: _PushButton
    on_press:
      then:
        - button.press: reboot
      
sensor:
  - platform: pulse_meter
    pin: 
      number: 6
      mode:
        input: true
    id: watermeter_pulse
    name: "Watermeter pulse"
    state_class: measurement
    device_class: volume_flow_rate
    internal_filter: 100ms
    internal_filter_mode: PULSE
    accuracy_decimals: 0
    unit_of_measurement: 'L/min'
    icon: mdi:water-pump
    timeout: 5min
    total:
      name: "Watermeter total"
      id: watermeter_total
      unit_of_measurement: 'L'
      device_class: water
      state_class: total_increasing
      accuracy_decimals: 0
      icon: mdi:water
      on_value:
        then:
          # Ignore the initial zero published during pulse_meter setup.
          - if:
              condition:
                lambda: 'return id(water_total_ready);'
              then:
                - globals.set:
                    id: totalWaterUsage
                    value: !lambda 'return (int) x;'
  
  - platform: uptime
    name: "_Uptime"
  - platform: wifi_signal
    name: "_Wi-Fi Signal"
    update_interval: 60s
      
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "_IP Address"
    ssid:
      name: "_Wi-Fi SSID"
    bssid:
      name: "_Wi-Fi BSSID"
  - platform: version
    name: "_ESPHome Version"
    hide_timestamp: true
